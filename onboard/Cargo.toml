[package]
name = "onboard"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1" }
proto = { path = "../proto" }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-sync = "0.8"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
heapless = "0.9.3"
lora-phy = "3.0.1"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-async = "1.0.0"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
exit = "deny"
mem_forget = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
lossy_float_literal = "deny"
