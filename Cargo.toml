# Workspace for the crates that build on your computer.
#
# `onboard` is excluded because it builds for the ESP32 with a different
# toolchain and target (see onboard/rust-toolchain.toml and
# onboard/.cargo/config.toml). Build it from inside the onboard/ directory.
[workspace]
resolver = "3"
members = ["proto", "ground"]
exclude = ["onboard"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
exit = "deny"
mem_forget = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
lossy_float_literal = "deny"
